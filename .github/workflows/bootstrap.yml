name: bootstrap

# Manual only: a full bootstrap takes up to 45 min per job and there are several jobs.
# Run it with: gh workflow run bootstrap.yml --ref <branch>
# Add -f macos=true to include the macOS job.
on:
  workflow_dispatch:
    inputs:
      macos:
        description: Also run the macOS job (bills at a multiple of Linux minutes)
        type: boolean
        default: false

concurrency:
  group: bootstrap-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  templates:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['24.04', '26.04']
    container: ubuntu:${{ matrix.ubuntu }}
    timeout-minutes: 15
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl git
      - uses: actions/checkout@v5
      - run: sh -c "$(curl -fsLS get.chezmoi.io)" -- -b /usr/local/bin
      - run: .github/ci/templates.sh

  bootstrap-personal:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['24.04', '26.04']
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - run: .github/ci/run-bootstrap.sh personal
        env:
          UBUNTU_VERSION: ${{ matrix.ubuntu }}

  bootstrap-corporate:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['24.04', '26.04']
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - run: .github/ci/run-bootstrap.sh corporate
        env:
          UBUNTU_VERSION: ${{ matrix.ubuntu }}

  # Runs only when the `macos` input is set: macOS minutes bill at a multiple of Linux minutes
  # on private repos.
  # The runner already has Homebrew and gh on PATH, so this cannot reproduce a fresh Mac.
  macos:
    if: ${{ inputs.macos }}
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - run: brew install chezmoi
      - run: .github/ci/templates.sh
        env:
          GH_TOKEN: ${{ github.token }}
